<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>NeuroFlow Designer</title>
<style>
  :root {
    --bg: #141e19;
    --canvas: #0e1512;
    --card: #18261f;
    --text: #ecf3ed;
    --muted: #849a8b;
    --border: #23352b;
    --lime: #c9ed84;
    --lime-dark: #0d1610;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body {
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    font-size: 12px;
    line-height: 1.4;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: var(--lime);
    color: var(--lime-dark);
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 15px;
  }
  .title { font-weight: 700; font-size: 14px; letter-spacing: -0.02em; }
  .subtitle { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin: 12px 0 6px;
  }

  .theme-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 14px;
    background: var(--canvas);
    padding: 3px;
    border-radius: 7px;
    border: 1px solid var(--border);
  }
  .theme-btn {
    padding: 6px 10px;
    text-align: center;
    border-radius: 5px;
    cursor: pointer;
    background: transparent;
    border: none;
    color: var(--muted);
    font-weight: 600;
    font-size: 11px;
    transition: all 0.12s;
  }
  .theme-btn.active {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
  }

  select {
    width: 100%;
    height: 36px;
    background: var(--canvas);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 0 10px;
    outline: none;
    font-size: 12px;
    margin-bottom: 16px;
  }
  select:focus {
    border-color: var(--lime);
  }

  .btn {
    width: 100%;
    height: 38px;
    border-radius: 6px;
    border: none;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: opacity 0.15s;
    margin-bottom: 8px;
  }
  .btn.primary {
    background: var(--lime);
    color: var(--lime-dark);
  }
  .btn.secondary {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn:hover { opacity: 0.9; }

  .status {
    margin-top: 12px;
    padding: 10px;
    border-radius: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    min-height: 40px;
    display: flex;
    align-items: center;
  }
  .status.success { color: var(--lime); border-color: rgba(201, 237, 132, 0.3); }
  .status.error { color: #f87171; border-color: rgba(248, 113, 113, 0.3); }
</style>
</head>
<body>

<div class="header">
  <div class="logo">N</div>
  <div>
    <div class="title">NeuroFlow Designer</div>
    <div class="subtitle">Figma Development Plugin</div>
  </div>
</div>

<div class="section-label">Тема интерфейса</div>
<div class="theme-toggle">
  <button class="theme-btn active" id="btnDark" onclick="setTheme('dark')">Тёмная (Dark)</button>
  <button class="theme-btn" id="btnLight" onclick="setTheme('light')">Светлая (Light)</button>
</div>

<div class="section-label">Выберите экран</div>
<select id="screenSelect">
  <option value="all">⚡ Все 6 экранов (Полный набор)</option>
  <option value="dashboard">1. Dashboard (Обзор системы)</option>
  <option value="agents">2. Agents (Каталог агентов)</option>
  <option value="workflows">3. Workflows (Редактор графов)</option>
  <option value="secondBrain">4. Second Brain (База знаний)</option>
  <option value="mcpHub">5. MCP Hub (Серверы и инструменты)</option>
  <option value="activity">6. Activity (Логи и расходы)</option>
</select>

<button class="btn primary" onclick="generate()">
  Сгенерировать в Figma
</button>

<button class="btn secondary" onclick="createTokens()">
  Создать цветовые стили
</button>

<div class="status" id="statusBox">
  Готов к созданию векторных фреймов с Auto Layout.
</div>

<script>
let currentTheme = 'dark';

function setTheme(theme) {
  currentTheme = theme;
  document.getElementById('btnDark').classList.toggle('active', theme === 'dark');
  document.getElementById('btnLight').classList.toggle('active', theme === 'light');
}

function generate() {
  const screen = document.getElementById('screenSelect').value;
  setStatus('Загрузка шрифтов Inter и построение фреймов...', 'loading');
  parent.postMessage({
    pluginMessage: {
      type: 'generate',
      screen,
      theme: currentTheme
    }
  }, '*');
}

function createTokens() {
  setStatus('Создание Paint Styles в документе...', 'loading');
  parent.postMessage({
    pluginMessage: {
      type: 'create-tokens'
    }
  }, '*');
}

function setStatus(text, type) {
  const box = document.getElementById('statusBox');
  box.textContent = text;
  box.className = 'status ' + (type || '');
}

window.onmessage = (event) => {
  const msg = event.data.pluginMessage;
  if (!msg) return;
  if (msg.type === 'done') {
    setStatus(msg.message, 'success');
  } else if (msg.type === 'error') {
    setStatus(msg.message, 'error');
  }
};
</script>

</body>
</html>
