version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: neuroflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neuroflow
      POSTGRES_PASSWORD: neuroflow_secret
      POSTGRES_DB: neuroflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroflow -d neuroflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: neuroflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    container_name: neuroflow-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://neuroflow:neuroflow_secret@postgres:5432/neuroflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: neuroflow-production-jwt-secret-key-2026
      WEB_URL: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.worker
    container_name: neuroflow-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://neuroflow:neuroflow_secret@postgres:5432/neuroflow
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.web
    container_name: neuroflow-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
