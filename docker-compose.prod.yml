services:
  postgres:
    image: postgres:16-alpine
    container_name: neuroflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neuroflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-neuroflow}
    volumes:
      - neuroflow_postgres_data:/var/lib/postgresql/data
    networks:
      - neuroflow_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neuroflow} -d ${POSTGRES_DB:-neuroflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: neuroflow-redis
    restart: unless-stopped
    volumes:
      - neuroflow_redis_data:/data
    networks:
      - neuroflow_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api
    container_name: neuroflow-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-neuroflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-neuroflow}
      REDIS_URL: redis://redis:6379
    networks:
      - neuroflow_internal
      - neuroflow_public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/healthz | grep -q 'ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 768M

  worker:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.worker
    container_name: neuroflow-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-neuroflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-neuroflow}
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
    networks:
      - neuroflow_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 768M

  web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.web
    container_name: neuroflow-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    networks:
      - neuroflow_public
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ | grep -q 'NeuroFlow' || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1024M

networks:
  neuroflow_internal:
    name: neuroflow_internal
    driver: bridge
  neuroflow_public:
    name: neuroflow_public
    driver: bridge

volumes:
  neuroflow_postgres_data:
    name: neuroflow_postgres_data
  neuroflow_redis_data:
    name: neuroflow_redis_data
